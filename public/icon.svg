<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#064E3B" />
      <stop offset="50%" stop-color="#065F46" />
      <stop offset="100%" stop-color="#022C22" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDE68A" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#022C22" flood-opacity="0.4" />
    </filter>
  </defs>

  <!-- Background Base -->
  <rect width="512" height="512" rx="128" fill="url(#emeraldGrad)" />

  <!-- Inner Subtle Glow Ring -->
  <rect x="24" y="24" width="464" height="464" rx="112" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="4" />

  <!-- Letter M Display -->
  <g filter="url(#shadow)">
    <path d="M 140 370 L 140 160 L 210 160 L 256 265 L 302 160 L 372 160 L 372 370 L 316 370 L 316 230 L 272 335 L 240 335 L 196 230 L 196 370 Z" fill="url(#goldGrad)" />
  </g>

  <!-- Audio Waves Indicator -->
  <circle cx="390" cy="140" r="28" fill="#F59E0B" />
  <path d="M 382 130 L 382 150 M 390 124 L 390 156 M 398 132 L 398 148" stroke="#022C22" stroke-width="4" stroke-linecap="round" />

  <!-- Camera Accent Icon -->
  <g transform="translate(196, 400) scale(0.6)">
    <rect x="0" y="10" width="200" height="120" rx="24" fill="rgba(255,255,255,0.18)" />
    <circle cx="100" cy="70" r="36" fill="#F59E0B" />
    <circle cx="100" cy="70" r="20" fill="#064E3B" />
  </g>
</svg>
